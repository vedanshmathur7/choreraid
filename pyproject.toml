[project]
name = "choreraid"
version = "1.1.0"
description = "Play a boss-rush game that really cleans your messy folder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_mess.py" = ["E501"]  # long lines are name-generator data tables
